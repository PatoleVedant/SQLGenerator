[project]
name = "fastapi-genai-app"
version = "0.1.0"
description = "FastAPI backend with Google GenAI integration"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Google GenAI SDK
    "google-genai>=1.16.1",

    # Environment variables
    "python-dotenv>=1.0.1",

    # Form handling / uploads
    "python-multipart>=0.0.9",

    # HTTP requests
    "httpx>=0.28.0",

    # Validation
    "pydantic>=2.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"